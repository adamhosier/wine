<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wine Regions Map</title>
  </head>
  <body>
    <script>
      (function () {
        var pathname = window.location.pathname;
        var segments = pathname.split("/").filter(Boolean);
        var basePath = segments.length > 1 ? "/" + segments[0] + "/" : "/";
        var basePrefix = basePath === "/" ? "" : basePath.slice(0, -1);
        var routePath = pathname.indexOf(basePrefix) === 0 ? pathname.slice(basePrefix.length) : pathname;
        var params = new URLSearchParams(window.location.search);
        params.set("p", routePath || "/");
        var nextSearch = params.toString();
        window.location.replace(basePath + (nextSearch ? "?" + nextSearch : "") + window.location.hash);
      })();
    </script>
  </body>
</html>
